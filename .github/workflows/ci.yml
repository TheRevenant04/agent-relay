name: CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Tests against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: agent_relay_test
        ports:
          # 5433 on the host so local `act` runs do not clash with the dev
          # compose postgres already published on 5432; GitHub runners are
          # unaffected by the exact host port as long as the URL below matches.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U relay -d agent_relay_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install -q --break-system-packages uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run starter + PostgreSQL integration tests
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@localhost:5433/agent_relay_test
        run: uv run pytest -q

  deploy:
    name: Build image and deploy to kind
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kind and kubectl
        shell: bash
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          if [ ! -x "$bin/kind" ]; then
            curl -sSLo "$bin/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
            chmod +x "$bin/kind"
          fi
          if [ ! -x "$bin/kubectl" ]; then
            curl -sSLo "$bin/kubectl" https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
            chmod +x "$bin/kubectl"
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/kind" version
          "$bin/kubectl" version --client

      - name: Create kind cluster
        shell: bash
        run: |
          set -euo pipefail
          if kind get clusters 2>/dev/null | grep -qx relay; then
            echo "kind cluster 'relay' already exists"
          else
            kind create cluster --name relay --wait 120s
          fi

      - name: Compute unique image tag
        id: tag
        shell: bash
        run: |
          short="$(git rev-parse --short HEAD)"
          echo "image=agent-relay:ci-${short}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "${{ steps.tag.outputs.image }}" .

      - name: Load image into kind
        run: kind load docker-image "${{ steps.tag.outputs.image }}" --name relay

      - name: Prepare kubeconfig
        shell: bash
        env:
          RELAY_KUBECONFIG: ${{ secrets.RELAY_KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          if [ -f /tmp/kind-kubeconfig ]; then
            src=/tmp/kind-kubeconfig
          elif [ -n "${RELAY_KUBECONFIG:-}" ]; then
            echo "$RELAY_KUBECONFIG" | base64 -d > "$HOME/.kube/config.src"
            src="$HOME/.kube/config.src"
          else
            # On GitHub runners the kind cluster created above already wrote
            # ~/.kube/config; act supplies /tmp/kind-kubeconfig instead.
            kubectl version --client
            kubectl cluster-info
            exit 0
          fi
          cp "$src" ~/.kube/config
          # When the job container can reach the kind control plane by node
          # name (local `act --network kind` runs), rewrite the host-loopback
          # server that kind wrote into the kubeconfig. Otherwise keep the
          # endpoint as provided: for host-network runs that loopback port is
          # kind's published API port, and on a real cluster it is the
          # cluster's own endpoint.
          if curl -ks --max-time 5 https://relay-control-plane:6443/version >/dev/null 2>&1; then
            sed -i -E 's#https://127\.0\.0\.1:[0-9]+#https://relay-control-plane:6443#' ~/.kube/config
          fi
          kubectl version --client

      - name: Deploy to kind
        run: |
          kubectl apply -k k8s
          kubectl -n agent-relay set image deployment/relay relay="${{ steps.tag.outputs.image }}"

      - name: Wait for rollout
        run: kubectl -n agent-relay rollout status deployment/relay --timeout=180s

      - name: Verify deployment
        shell: bash
        run: |
          kubectl -n agent-relay get pods -l app=relay,component=api
          kubectl -n agent-relay get deployment relay \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'