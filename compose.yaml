services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: agent_relay
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d agent_relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  relay:
    build: .
    image: agent-relay:local
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/agent_relay
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: