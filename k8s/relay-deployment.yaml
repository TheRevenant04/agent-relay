apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: agent-relay
  labels:
    app: relay
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
      component: api
  template:
    metadata:
      labels:
        app: relay
        component: api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U relay -d agent_relay; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: relay
          image: agent-relay:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: RELAY_DATABASE_URL
              value: "postgresql+psycopg://relay:$(POSTGRES_PASSWORD)@postgres:5432/agent_relay"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi